plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.moddev' version "${mdg_version}"
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

version = "${mod_version}"
group = "net.geforcemods.${mod_id}"

base {
	archivesName = "${mod_id}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

processResources {
	var expandProps = [
		'mod_name': mod_name,
		'mod_id': mod_id,
		'mod_version': mod_version,
		'authors': authors,
		'neoforge_min_version': neoforge_min_version,
		'mc_min_version': mc_min_version
	]

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand expandProps
	}

	inputs.properties(expandProps)
	exclude ".cache"
	duplicatesStrategy = 'include'

	//minify json resources
	doLast {
		fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
			File file -> file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
		}
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "${neoforge_version}"
	validateAccessTransformers = true

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file('run/' + name)
			ideName = "SC ${project.mc_version} " + ideName.get()
		}

		client {
			client()
		}

		client2 {
			client()
			gameDirectory = project.file('run/client')
			programArguments.addAll('--username', 'Dev2')
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', "${mod_id}", '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
	maven {
		url = "https://cursemaven.com/"
		content {
			includeGroup "curse.maven"
		}
	}

	exclusiveContent {
		forRepository {
			maven {
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	maven {
		url = "https://maven.caffeinemc.net/releases"
	}

	if (port) {
		maven {
			url = uri("https://prmaven.neoforged.net/NeoForge/pr${porting_pr}")
			content {
				includeModule("net.neoforged", "neoforge")
			}
		}
	}
}

dependencies {
	compileOnly "curse.maven:ftb-library-forge-404465:${ftb_library}" //FTB Teams dependency
	compileOnly "curse.maven:ftb-teams-forge-404468:${ftb_teams}"
	implementation "curse.maven:jei-238222:${jei}"
    //compileOnly "curse.maven:the-one-probe-245211:${top}" //Incompatible at compile time because of ResourceLocation -> Identifier
	implementation "curse.maven:jade-324717:${jade}"
	implementation "curse.maven:betterf3-401648:${betterf3}"
	implementation "curse.maven:cloth-config-348521:${cloth_config}" //BetterF3 dependency
	implementation "curse.maven:wthit-forge-455982:${wthit}"
	implementation "curse.maven:badpackets-615134:${badpackets}" //WTHIT dependency
	compileOnly "curse.maven:projecte-226410:${projecte}"
	compileOnly "curse.maven:embeddium-908741:${embeddium}" //Incompatible with Sodium
	// The actual mod jar is jarjar'd into the Modrinth jar, but NeoForge doesn't load it, so the mod has to be added from CaffeineMCs' maven separately
	compileOnly "maven.modrinth:sodium:mc${sodium_mc}-${sodium_self}-neoforge"
	compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_self}+mc${sodium_mc}"
	implementation "curse.maven:distant-horizons-508933:${distant_horizons}"
	implementation "curse.maven:curios-309927:${curios}"
}

tasks.named('jar', Jar).configure {
	exclude("net/geforcemods/${mod_id}/datagen/**") //exclude files from the built jar that are only used to generate the assets & data
	archiveFileName = "[${project.mc_version}] ${mod_name} v${mod_version}.jar"
	manifest {
		attributes(["Specification-Title": "${mod_name}",
					"Specification-Vendor": "${authors}",
					"Specification-Version": "${mod_version}",
					"Implementation-Title": "${mod_name}",
					"Implementation-Version": "${mod_version}",
					"Implementation-Vendor": "${authors}"],)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-Xmaxerrs" << "10000"
	options.encoding = 'UTF-8'
	options.getRelease().set(java_version.toInteger())
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}